<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Motorcycle Braking Simulator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🏍️ Motorcycle Braking Simulator</h1>
        <p>Motorcycle Dynamics & Braking Analysis</p>
    </header>

    <main>

        <!-- INPUT PANEL -->
        <section class="panel">

            <h2>Simulation Parameters</h2>

            <div class="input-group">
                <label for="mass">Motorcycle Mass (kg)</label>
                <input
                    type="number"
                    id="mass"
                    value="200"
                    min="1"
                >
            </div>

            <div class="input-group">
                <label for="speed">Initial Speed (km/h)</label>
                <input
                    type="number"
                    id="speed"
                    value="100"
                    min="1"
                >
            </div>

            <div class="input-group">
                <label for="friction">Road Friction (μ)</label>
                <input
                    type="number"
                    id="friction"
                    value="0.8"
                    min="0.01"
                    max="1.5"
                    step="0.01"
                >
            </div>

            <div class="input-group">
                <label for="brakeForce">Brake Force (N)</label>
                <input
                    type="number"
                    id="brakeForce"
                    value="5000"
                    min="1"
                >
            </div>

            <button id="simulateButton">
                SIMULATE
            </button>

        </section>


        <!-- SIMULATION -->
        <section class="panel simulation-panel">

            <h2>Live Simulation</h2>

            <div class="road">

                <div id="motorcycle">
                    🏍️
                </div>

                <div class="stop-line"></div>

            </div>

            <div class="simulation-status">
                <span id="simulationStatus">
                    Ready
                </span>
            </div>

        </section>


        <!-- RESULTS -->
        <section class="results">

            <div class="result-card">
                <h3>Stopping Time</h3>
                <p id="stoppingTime">--</p>
                <span>seconds</span>
            </div>

            <div class="result-card">
                <h3>Stopping Distance</h3>
                <p id="stoppingDistance">--</p>
                <span>meters</span>
            </div>

            <div class="result-card">
                <h3>Maximum Deceleration</h3>
                <p id="deceleration">--</p>
                <span>m/s²</span>
            </div>

            <div class="result-card">
                <h3>Actual Brake Force</h3>
                <p id="actualBrakeForce">--</p>
                <span>newtons</span>
            </div>

        </section>


        <!-- Graph removed for motorcycle-only UI -->

    </main>

    <script src="scripts.js"></script>

</body>
</html>
